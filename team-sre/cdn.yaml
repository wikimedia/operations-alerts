# deploy-tag: ops
groups:
  - name: ats
    rules:
      # record backend rps in a rule in order to reuse in ATSBackendErrorsHigh
      - record: ats_backend:trafficserver_backend_requests:rate5m
        expr: |
          sum by (backend, cluster, status) (
            rate(trafficserver_backend_requests_seconds_count{backend!~"localhost|127.0.0.1"}[5m])
          )

      # record per-backend availability in a rule in order to reuse in ATSBackendErrorsHigh.
      # The 'or' clause makes sure backends without any 5xx get an explicit 1
      # instead of dropping out of the result altogether.
      - record: ats_backend:trafficserver_backend_availability:ratio5m
        expr: |
          1 - (
            (
              sum by (backend, cluster) (ats_backend:trafficserver_backend_requests:rate5m{status=~"5[0-9][0-9]"})
              or
              0 * sum by (backend, cluster) (ats_backend:trafficserver_backend_requests:rate5m)
            )
            /
            sum by (backend, cluster) (ats_backend:trafficserver_backend_requests:rate5m)
          )

      - alert: ATSBackendErrorsHigh
        annotations:
          description: '{{ $value | humanizePercentage }} of requests from ATS to {{ $labels.backend }} in {{ $externalLabels.site }} returning 5xx'
          summary: 'ATS: elevated 5xx error ratio from {{ $labels.backend }} in {{ $externalLabels.site }} #page'
          dashboard: 'https://grafana.wikimedia.org/d/1T_4O08Wk/ats-backends-origin-servers-overview?orgId=1&viewPanel=12&var-site={{ $externalLabels.site }}&var-cluster={{ $labels.cluster | reReplaceAll "cache_" ""}}&var-origin={{ $labels.backend }}'
          runbook: 'https://wikitech.wikimedia.org/wiki/Apache_Traffic_Server#Debugging'
        # page on ratio of failed requests factoring in overall
        # traffic rate.
        # The >= 5 is to account for services with very low RPS
        # potentially triggering this alert erroneously.
        expr: |
          (
            1 - ats_backend:trafficserver_backend_availability:ratio5m{
                    backend!~"((api|rest)-gateway(-ro)?|performance|phabricator|wcqs|wdqs-(main|scholarly)).discovery.wmnet"
                }
          ) > 0.05
          and on (backend, cluster)
          (
            sum by (backend, cluster) (ats_backend:trafficserver_backend_requests:rate5m) >= 5
          )
        for: 15m
        labels:
          severity: page
          team: sre
