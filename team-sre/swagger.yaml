# deploy-tag: ops
groups:
  - name: swagger-up
    rules:
    - alert: SwaggerProbeHasFailures
      annotations:
        description: One or more openapi/swagger checks for {{$labels.instance}} returned an unexpected response (probed from {{$externalLabels.site}}).
        summary: "{{$labels.instance}}: openapi/swagger endpoint check failed"
        dashboard: https://grafana.wikimedia.org/d/_77ik484k/openapi-swagger-endpoint-state?var-site={{$externalLabels.site}}
        runbook: https://wikitech.wikimedia.org/wiki/Runbook#{{ $labels.instance }}
      expr: |
        service_checker_probe_success{job="probes/swagger"} < 1
      for: 5m
      labels:
        severity: critical
        team: sre
    - alert: SwaggerProbeUnavailable
      annotations:
        description: The openapi/swagger probe for {{$labels.instance}} could not complete (probed from {{$externalLabels.site}}).
        summary: "{{$labels.instance}}: openapi/swagger probe could not run (scrape failed)"
        dashboard: https://grafana.wikimedia.org/d/_77ik484k/openapi-swagger-endpoint-state?var-site={{$externalLabels.site}}
        runbook: https://wikitech.wikimedia.org/wiki/Runbook#{{ $labels.instance }}
      expr: |
        up{job="probes/swagger"} < 1
      for: 5m
      labels:
        severity: critical
        team: sre
