# deploy-tag: ops
# deploy-site: eqiad, codfw

groups:
- name: gitlab
  rules:
  - alert: GitLabCIJobErrors
    expr: sum (rate(gitlab_ci_job_failure_reasons{reason!="script_failure"}[5m])) > 0.05
    for: 10m
    labels:
      severity: task
      team: collaboration-services
    annotations:
      summary: "GitLab - High CI job error rate"
      description: "GitLab CI job error rate {{ $value }} is above threshold of 0.05"
      dashboard: https://grafana.wikimedia.org/d/Chb-gC07k/gitlab-ci-overview
      runbook: https://wikitech.wikimedia.org/wiki/GitLab/Runbook
  - alert: GitLabSidekiqQueueOverloaded
    expr: sum(avg_over_time(sidekiq_queue_size{}[10m])) by (instance) > 1000
    for: 1h
    labels:
      severity: task
      team: collaboration-services
    annotations:
      summary: "GitLab - Sidekiq queue is filling up"
      description: "Sidekiq queue is at {{ $value }} and keeps growing."
      dashboard: 'https://grafana.wikimedia.org/d/R_1IvBZnz/gitlab-omnibus-overview?orgId=1&from=now-2d&to=now&timezone=utc&var-node={{ $labels.instance | reReplaceAll ":[0-9]+" "" }}&refresh=1m&viewPanel=12'
      runbook: https://wikitech.wikimedia.org/wiki/GitLab/Cheat_Sheet#Restarts
  - alert: GitLabCIPipelineErrors
    expr: sum (rate(gitlab_ci_pipeline_failure_reasons[5m])) > 0.05
    for: 10m
    labels:
      severity: task
      team: collaboration-services
    annotations:
      summary: "GitLab - High pipeline error rate"
      description: "GitLab pipeline error rate {{ $value }} is above threshold of 0.05"
      dashboard: https://grafana.wikimedia.org/d/Chb-gC07k/gitlab-ci-overview
      runbook: https://wikitech.wikimedia.org/wiki/GitLab/Runbook
  - alert: GitLabCIPipelineLatency
    expr: rate(gitlab_ci_pipeline_creation_duration_seconds_sum[5m]) / rate(gitlab_ci_pipeline_creation_duration_seconds_count[5m]) > 10
    for: 5m
    labels:
      severity: task
      team: collaboration-services
    annotations:
      summary: "GitLab - High CI pipeline creation time"
      description: "GitLab pipeline average creation time {{ $value }}s is above threshold of 10s"
      dashboard: https://grafana.wikimedia.org/d/Chb-gC07k/gitlab-ci-overview
      runbook: https://wikitech.wikimedia.org/wiki/GitLab/Runbook
  - alert: GitLabRunnerTrustedConfigMissing
    expr: gitlab_runners_up{description=~"Trusted.*", locked="False"} > 0 or gitlab_runners_up{description=~"Trusted.*", access_level="not_protected"} > 0
    labels:
      severity: task
      team: collaboration-services
    annotations:
      summary: "Trusted gitlab-runner missing config"
      description: "The trusted gitlab-runner {{ $labels.description }}, ID {{ $labels.description }} is missing a config"
      dashboard: https://grafana.wikimedia.org/d/Chb-gC07k/gitlab-ci-overview
      runbook: https://wikitech.wikimedia.org/wiki/GitLab/Runbook#GitLabRunnerTrustedConfigMissing
  # The three staleness alerts below consume the metrics pushed by
  # gitlab-backup.sh (primary) and gitlab-restore.sh (replicas) to the
  # pushgateway. They only advance on success, so their age is the time since
  # the last successful run. The pushgateway only exists in one core site,
  # hence the pint disable: the series are absent from the other site.
  # The whole chain runs twice a day (hieradata/role/common/gitlab.yaml):
  # full backup 13:04 and 23:04, rsync 01:00 and 14:00, restore 02:00 and 16:00.
  # Thresholds are sized so a single missed cycle never fires.
  - alert: GitLabBackupStale
    # max() keeps this immune to leftover pushgateway groups from hosts that
    # no longer take backups (e.g. an ex-primary after a failover).
    # 30h: the longest normal gap is 14h (23:04 to 13:04) plus the backup
    # duration, so one missed backup stays quiet and two fire.
    # pint disable promql/series
    expr: time() - max(gitlab_backup_last_run{type="full"}) > 30 * 3600
    labels:
      severity: task
      team: collaboration-services
    annotations:
      summary: "GitLab - no successful full backup in the last 30h"
      description: "The most recent successful GitLab full backup is more than 30 hours old, check the full-backup timer on the primary."
      dashboard: https://grafana.wikimedia.org/d/R_1IvBZnz/gitlab-omnibus-overview
      runbook: https://wikitech.wikimedia.org/wiki/GitLab/Backup_and_Restore
  - alert: GitLabRestoreStale
    # Restores run at 02:00 and 16:00 on the replicas, so 30h leaves room for
    # one missed run plus its duration. The host filter excludes the
    # frozen series of the legacy job-level pushgateway groups (pre host-grouping
    # pushes), which linger until the next pushgateway restart. After a failover,
    # delete the ex-replica's frozen group to silence this alert (or wait for a
    # pushgateway restart, it has no persistence):
    # curl -X DELETE http://prometheus-pushgateway.discovery.wmnet/metrics/job/gitlab_restore/host/<host>
    # pint disable promql/series
    expr: time() - gitlab_restore_last_run{host=~".+"} > 30 * 3600
    labels:
      severity: task
      team: collaboration-services
    annotations:
      summary: "GitLab - replica {{ $labels.instance }} has not completed a restore in 30h"
      description: "The gitlab-backup-restore timer on {{ $labels.instance }} has not reported a successful restore for more than 30 hours."
      dashboard: https://grafana.wikimedia.org/d/R_1IvBZnz/gitlab-omnibus-overview
      runbook: https://wikitech.wikimedia.org/wiki/GitLab/Backup_and_Restore
  - alert: GitLabReplicaDataStale
    # Age of the backup the replica last restored: covers the whole
    # backup -> rsync -> restore chain, including an rsync that silently stops
    # transferring fresh backups while restores keep succeeding on an old tar.
    # In steady state a restore picks up a backup created ~3h earlier, and that
    # age peaks at ~17h just before the next restore. A single missed backup
    # peaks at ~27h, so 30h absorbs one missed cycle and fires on the second.
    # The host filter excludes the frozen legacy job-level groups, see above.
    # pint disable promql/series
    expr: time() - gitlab_restore_backup_created{host=~".+"} > 30 * 3600
    labels:
      severity: task
      team: collaboration-services
    annotations:
      summary: "GitLab - replica {{ $labels.instance }} serves data older than 30h"
      description: "The backup last restored on {{ $labels.instance }} was created more than 30 hours ago, the backup, rsync or restore chain is stale."
      dashboard: https://grafana.wikimedia.org/d/R_1IvBZnz/gitlab-omnibus-overview
      runbook: https://wikitech.wikimedia.org/wiki/GitLab/Backup_and_Restore