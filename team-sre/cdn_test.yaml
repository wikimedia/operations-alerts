rule_files:
  - cdn.yaml
evaluation_interval: 1m
tests:
  # Ensure that we *do* page on a higher level of errors for a high traffic service
  - interval: 1m
    input_series:
      - series: trafficserver_backend_requests_seconds_count{backend="pinkunicorn.service",cluster="cache_upload",instance="cp2",job="trafficserver-upload",method="GET",prog="atsbackend.mtail",site="codfw",status="500"}
        values: '0+120x30'
      - series: trafficserver_backend_requests_seconds_count{backend="pinkunicorn.service",cluster="cache_upload",instance="cp2",job="trafficserver-upload",method="GET",prog="atsbackend.mtail",site="codfw",status="200"}
        values: '0+1080x30'
    external_labels:
      site: codfw
    alert_rule_test:
      - alertname: ATSBackendErrorsHigh
        eval_time: 25m
        exp_alerts:
          - exp_labels:
              severity: page
              team: sre
              backend: 'pinkunicorn.service'
              cluster: 'cache_upload'
            exp_annotations:
              summary: 'ATS: elevated 5xx error ratio from pinkunicorn.service in codfw #page'
              description: '10% of requests from ATS to pinkunicorn.service in codfw returning 5xx'
              runbook: https://wikitech.wikimedia.org/wiki/Apache_Traffic_Server#Debugging
              dashboard: https://grafana.wikimedia.org/d/1T_4O08Wk/ats-backends-origin-servers-overview?orgId=1&viewPanel=12&var-site=codfw&var-cluster=upload&var-origin=pinkunicorn.service

  # Ensure that we *don't* page on a low level of failures on a high traffic situation
  - interval: 1m
    input_series:
      - series: trafficserver_backend_requests_seconds_count{backend="pinkunicorn.service",cluster="cache_upload",instance="cp2",job="trafficserver-upload",method="GET",prog="atsbackend.mtail",site="codfw",status="500"}
        values: '0+600x30'
      - series: trafficserver_backend_requests_seconds_count{backend="pinkunicorn.service",cluster="cache_upload",instance="cp2",job="trafficserver-upload",method="GET",prog="atsbackend.mtail",site="codfw",status="200"}
        values: '0+60000x30'
    external_labels:
      site: codfw
    alert_rule_test:
      - alertname: ATSBackendErrorsHigh
        eval_time: 25m
        exp_alerts: []

  # *don't* page on a failing, low-traffic service
  - interval: 1m
    input_series:
      - series: trafficserver_backend_requests_seconds_count{backend="pinkunicorn.service",cluster="cache_upload",instance="cp2",job="trafficserver-upload",method="GET",prog="atsbackend.mtail",site="codfw",status="500"}
        values: '0+60x30'
    external_labels:
      site: codfw
    alert_rule_test:
      - alertname: ATSBackendErrorsHigh
        eval_time: 25m
        exp_alerts: []
