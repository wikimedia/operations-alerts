# deploy-tag: cloud
# deploy-site: eqiad

groups:
  - name: magnum-api
    rules:
      - alert: CloudVPSMagnumDown
        expr: openstack_container_infra_up != 1
        for: 10m
        labels:
          team: wmcs
          severity: warning
          service: cloudvps
        annotations:
          summary: "Magnum infra reports as down"
          description: "No Magnum api servers can be reached. Just because this is up, that doesn't mean the whole magnum service works."
          runbook: https://wikitech.wikimedia.org/wiki/Portal:Cloud_VPS/Admin/Runbooks/Magnum
          dashboard: https://grafana.wikimedia.org/d/anbc675/wmcs-openstack-magnum-status
