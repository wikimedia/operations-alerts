# deploy-tag: cloud
# deploy-site: eqiad

# Alerts for generic nodes being down
groups:
  - name: cloudvirt
    rules:
      - alert: CloudVirtDown
        annotations:
          summary: 'nova-compute on node {{ $labels.instance }} is down. #page'
          description: >
            The cloudvirt node {{ $labels.instance }} reports nova-compute down. This is a
            major outage that requires you to either restore the server or evacuate manually the VMs on it.
          dashboard: 'https://grafana.wikimedia.org/d/000000377/host-overview?orgId=1&var-server={{ $labels.instance }}'
          runbook: "https://wikitech.wikimedia.org/wiki/Portal:Cloud_VPS/Admin/Runbooks/CloudVirtDown"
        expr: openstack_nova_agent_state{adminState="enabled"} == 0
        for: 20m
        labels:
          severity: page
          team: wmcs

      - alert: CloudVirtDisabled
        annotations:
          summary: '{{ $labels.instance }} out of service for long'
          description: >
            The cloudvirt node {{ $labels.instance }} has been in maintenance
            for multiple days. Check whether the host is meant to be out of
            service.
          dashboard: 'https://grafana.wikimedia.org/d/000000377/host-overview?orgId=1&var-server={{ $labels.instance }}'
          runbook: TODO
        expr: openstack_nova_agent_state{adminState="disabled"} == 1
        for: 10d
        labels:
          severity: warning
          team: wmcs
