# deploy-tag: ops
# deploy-site: eqiad, codfw

groups:
  - name: mysql
    rules:
      
    - alert: MysqlPredictiveFreeDiskSpace
      annotations:
        description: "Host {{$labels.instance}} might be at risk of running out of space on the {{$labels.mountpoint}} partition."
        runbook: https://wikitech.wikimedia.org/wiki/MariaDB/troubleshooting
        dashboard: 'https://grafana.wikimedia.org/d/419f8741-4177-49bc-939d-6ee002ac9b70/mariadb-free-disk-space-predictions'
        summary: "Host {{$labels.instance}} predictive low disk space on {{$labels.mountpoint}}"
      expr: |
        predict_linear(node_filesystem_avail_bytes{instance=~"db1.*|db2.*|es1.*|es2.*|pc1.*|pc2.*", mountpoint=~"/|/srv"}[1h], 3600*8) 
        < 
        clamp_max(
          node_filesystem_size_bytes{instance=~"db1.*|db2.*|es1.*|es2.*|pc1.*|pc2.*", mountpoint=~"/|/srv"} * 0.05, 
          10 * 1024 * 1024 * 1024
        )
      for: 30m
      labels:
        severity: warning
        team: data-persistence

    - alert: MysqlPredictiveFreeDiskSpace
      annotations:
        description: "Host {{$labels.instance}} might be at risk of running out of space on the {{$labels.mountpoint}} partition."
        runbook: https://wikitech.wikimedia.org/wiki/MariaDB/troubleshooting
        dashboard: 'https://grafana.wikimedia.org/d/419f8741-4177-49bc-939d-6ee002ac9b70/mariadb-free-disk-space-predictions'
        summary: "Host {{$labels.instance}} predictive low disk space on {{$labels.mountpoint}}"
      expr: |
        predict_linear(node_filesystem_avail_bytes{instance=~"db1.*|db2.*|es1.*|es2.*|pc1.*|pc2.*", mountpoint=~"/|/srv"}[1h], 3600*8) 
        < 
        clamp_max(
          node_filesystem_size_bytes{instance=~"db1.*|db2.*|es1.*|es2.*|pc1.*|pc2.*", mountpoint=~"/|/srv"} * 0.005, 
          1 * 1024 * 1024 * 1024
        )
      for: 30m
      labels:
        severity: critical
        team: data-persistence
