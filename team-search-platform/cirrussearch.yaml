# deploy-tag: ops
# deploy-site: eqiad, codfw

groups:
 - name: cirrussearch

   rules:
    - alert: CirrusSearchHighOldGCFrequency
      expr: increase(elasticsearch_jvm_gc_collection_seconds_count{gc="old"}[1h]) > 60
      for: 5m
      labels:
        team: search-platform
        severity: warning
      annotations:
        summary: "OpenSearch instance {{$labels.name}} is running the old gc excessively"
        description: "OpenSearch is out of memory and will have degraded latency"
        runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
        dashboard: https://grafana.wikimedia.org/d/000000462/elasticsearch-memory

    - alert: CirrusSearchIndexTooOld
      expr: elasticsearch_indices_age_days{index=~"commonswiki_file|wikidatawiki_content"} > 120
      for: 1m
      labels:
        team: search-platform
        severity: task
      annotations:
        summary: "{{$labels.index}} index in {{$labels.exported_cluster}} is ready for reindexing"
        description: "The reindexing process should be run to ensure multi-lingual analysis chain updates are applied"
        runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
        dashboard: TODO

    - alert: CirrusSearchJobQueueBacklogTooBig
      expr: >
        kafka_burrow_partition_lag{
          exported_cluster=~"main-.*",
          group=~"cpjobqueue.*",
          topic=~".*cirrusSearch(DeleteArchive|DeletePages|ElasticaWrite|LinksUpdate*|OtherIndex)",
          topic!~".*retry.*",
          group!~".*partitioner.*"} > 200000
      for: 10m
      labels:
        team: search-platform
        severity: warning
        site: eqiad
      annotations:
        summary: 'CirrusSearch job topic {{$labels.topic}} is heavily backlogged with {{ $value | humanize }} messages'
        description: "CirrusSearch job backlog is too big"
        runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
        dashboard: 'https://grafana.wikimedia.org/d/CbmStnlGk/jobqueue-job?orgId=1&var-dc={{ $externalLabels.site }}%20prometheus/k8s&var-job={{ $labels.topic | reReplaceAll ".*[.]([^.]*$)" "${1}"}}'

    - alert: CirrusSearchUpdaterKafkaMessagesInTooLow
      expr: sum(irate(kafka_server_BrokerTopicMetrics_MessagesIn_total{topic=~"(eqiad|codfw).cirrussearch.update_pipeline.update.v1"}[5m])) < 1
      for: 5m
      labels:
        team: search-platform
        severity: critical
      annotations:
        summary: 'The summed message update rate of `(eqiad|codfw).cirrussearch.update_pipeline.update.v1` is too low'
        description: "Unexpectedly low Kafka topic message-in rate for the last 5 minutes"
        runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
        dashboard: 'https://grafana.wikimedia.org/d/000000234/kafka-by-topic?orgId=1&var-dc={{ $externalLabels.site }}%2520prometheus%252Fops&var-kafka_cluster=main-eqiad&var-kafka_broker=All&from=now-1h&to=now&refresh=5m&var-topic=codfw.cirrussearch.update_pipeline.update.v1&var-topic=eqiad.cirrussearch.update_pipeline.update.v1&viewPanel=6'

    - alert: CirrusSearchNodeIndexingNotIncreasing
      expr: increase(elasticsearch_indices_indexing_index_total{exported_cluster=~"production-search-(eqiad|codfw)", index=""}[30m]) == 0
      for: 5m
      labels:
        team: search-platform
        severity: warning
      annotations:
        summary: "OpenSearch instance {{$labels.name}} is not indexing"
        description: "An OpenSearch instance is not performing index work; find out why"
        runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
        dashboard: 'https://grafana.wikimedia.org/d/JLK3I_siz/elasticsearch-indexing?orgId=1&from=now-3d&to=now&viewPanel=57'

    - alert: CirrusSearchTitleSuggestIndexTooOld
      expr: elasticsearch_indices_age_days{exported_cluster=~"production-search-.*", index="*_titlesuggest"} > 3.25
      for: 5m
      labels:
        team: search-platform
        severity: warning
      annotations:
        summary: "Some search indices that power autocomplete have not been updated recently"
        description: "The daily build process for autocomplete indices is probably having issues and should be investigated."
        runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
        dashboard: 'TODO'

    - alert: CirrusSearchThreadPoolRejectionsTooHigh
      expr: >
            rate(elasticsearch_thread_pool_rejected_count{type="search",job="elasticsearch", exported_cluster=~"production-search-(codfw|eqiad|omega-codfw|omega-eqiad|psi-codfw|psi-eqiad)"}[5m]) > 1
      for: 5m
      labels:
        team: search-platform
        severity: critical
      annotations:
        summary: "{{ $labels.name }} is rejecting excessive amounts of queries due to a full thread pool"
        description: "Check hot shards and consider banning the node to force shard reallocation"
        runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
        dashboard: 'https://grafana.wikimedia.org/goto/aoZBw8pNR?orgId=1'

 # search platform hosts change critical and warning thresholds from the usual thresholds (team-sre/resources.yaml)
    - alert: DiskSpace
      expr: |
       (node_filesystem_avail_bytes{
         fstype!="tmpfs",
         cluster=~"(elasticsearch|cloudelastic|relforge)"
       }
       / node_filesystem_size_bytes)
       * on (instance) group_left(team) role_owner < 0.1
      for: 5m
      labels:
       severity: critical
       team: "{{$labels.team}}"
      annotations:
        summary: "Disk space {{$labels.instance}}:{{$labels.mountpoint}} {{ $value | humanizePercentage }} free"
        description: "Disk space {{$labels.instance}}:{{$labels.mountpoint}} ({{$labels.fstype}})"
        dashboard: 'https://grafana.wikimedia.org/d/000000377/host-overview?orgId=1&viewPanel=12&var-server={{ $labels.instance | reReplaceAll "^([^:]+).*" "${1}" }}'
        runbook: https://wikitech.wikimedia.org/wiki/Monitoring/Disk_space

    - alert: DiskSpace
      expr: |
       (node_filesystem_avail_bytes{
         fstype!="tmpfs",
         cluster=~"(elasticsearch|cloudelastic|relforge)"
       }
       / node_filesystem_size_bytes)
       * on (instance) group_left(team) role_owner < 0.15
      for: 5m
      labels:
        severity: warning
        team: "{{$labels.team}}"
      annotations:
        summary: "Disk space {{$labels.instance}}:{{$labels.mountpoint}} {{ $value | humanizePercentage }} free"
        description: "Disk space {{$labels.instance}}:{{$labels.mountpoint}} ({{$labels.fstype}})"
        dashboard: 'https://grafana.wikimedia.org/d/000000377/host-overview?orgId=1&viewPanel=12&var-server={{ $labels.instance | reReplaceAll "^([^:]+).*" "${1}" }}'
        runbook: https://wikitech.wikimedia.org/wiki/Monitoring/Disk_space

    - alert: CirrusSearchAPIsUnreachable
      annotations:
        summary: OpenSearch API endpoint not reachable on instance {{ $labels.instance }}
        description: OpenSearch API endpoint not reachable on instance {{ $labels.instance }}
        dashboard:
          "https://grafana.wikimedia.org/d/e7d7fa18-7bc3-4548-bb07-ef261a9d3b8b/opensearch-cluster-health\
          ?var-cluster={{ $labels.exported_cluster }}"
        runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
      expr: >
        (label_replace(
          sum by (cluster, exported_cluster, instance) (
            up{job="elasticsearch"}
            * on (instance) group_left(exported_cluster)
            max by (instance, exported_cluster) (
              1 + last_over_time(elasticsearch_clusterinfo_version_info{exported_cluster=~"production-search-.*"}[1d])
            )
          )
        , "nodename", "$1", "instance", "(.*):.*")
        * on(cluster, nodename) group_left(team)
        label_replace(
          max by(cluster, instance, team) (
            last_over_time(role_owner{cluster=~"elasticsearch|cloudelastic", team!="unknown"}[1d])
          )
        , "nodename", "$1", "instance", "(.*):.*"))
         < 1
      for: 5m
      labels:
        severity: warning

    - &cirrussearch_cluster_health
      alert: CirrusSearchClusterHealth
      annotations:
        summary: OpenSearch cluster health reported as {{ $labels.color }}
        description: OpenSearch cluster health reported as {{ $labels.color }}
        dashboard:
          "https://grafana.wikimedia.org/d/e7d7fa18-7bc3-4548-bb07-ef261a9d3b8b/opensearch-cluster-health\
          ?var-cluster={{ $labels.exported_cluster }}"
        runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
      expr: >
        max without (nodename) ( max (label_replace(elasticsearch_cluster_health_status{color="yellow", exported_cluster=~"production-search-.*"}, "nodename", "$1", "instance", "(.*):.*")) by (cluster, exported_cluster, nodename, color)
        * on(cluster, nodename) group_left(team)
        label_replace(role_owner{cluster=~"elasticsearch|cloudelastic", team!="unknown"}, "nodename", "$1", "instance", "(.*):.*"))
        > 0
      for: 12h
      labels:
        severity: warning

    - <<: *cirrussearch_cluster_health
      expr: >
        max without (nodename) ( sum (label_replace(elasticsearch_cluster_health_status{color="red", exported_cluster=~"production-search-.*"}, "nodename", "$1", "instance", "(.*):.*")) by (cluster, exported_cluster, nodename, color)
        * on(cluster, nodename) group_left(team)
        label_replace(role_owner{cluster=~"elasticsearch|cloudelastic", team!="unknown"}, "nodename", "$1", "instance", "(.*):.*"))
        > 0
      for: 5m
      labels:
        severity: critical

    - alert: CirrusSearchUnassignedOrInitializingShardsRatio
      annotations:
        summary: Unassigned+Initializing shards exceed the allowed ratio
        description: Unassigned+Initializing shards exceed the allowed ratio
        dashboard:
          "https://grafana.wikimedia.org/d/e7d7fa18-7bc3-4548-bb07-ef261a9d3b8b/opensearch-cluster-health\
          ?var-cluster={{ $labels.exported_cluster }}"
        runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
      expr: >
        (max by (cluster, exported_cluster, team)
          (sum
            (label_replace({__name__=~"elasticsearch_cluster_health_(unassigned|initializing)_shards", exported_cluster=~"production-search-.*"}, "nodename", "$1", "instance", "(.*):.*"))
          by (cluster, exported_cluster, nodename)
          * on(cluster, nodename) group_left(team)
            label_replace(role_owner{cluster=~"elasticsearch|cloudelastic", team!="unknown"}, "nodename", "$1", "instance", "(.*):.*"))
        /
        max by (cluster, exported_cluster, team)
          (sum
            (label_replace({__name__=~"elasticsearch_cluster_health_(unassigned|initializing|active|relocating|active_primary|delayed_unassigned)_shards"}, "nodename", "$1", "instance", "(.*):.*"))
          by (cluster, exported_cluster, nodename)
          * on(cluster, nodename) group_left(team)
            label_replace(role_owner{cluster=~"elasticsearch|cloudelastic", team!="unknown"}, "nodename", "$1", "instance", "(.*):.*"))
        ) * 100
        > 5
      for: 12h
      labels:
        severity: critical

