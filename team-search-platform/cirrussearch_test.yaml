rule_files:
  - cirrussearch.yaml
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: elasticsearch_jvm_gc_collection_seconds_count{exported_cluster="production-search-testing", gc="old", name="elastic1002-production-search-eqiad"}
        values: 0+2x60
    alert_rule_test:
      - alertname: CirrusSearchHighOldGCFrequency
        eval_time: 60m
        exp_alerts:
          - exp_labels:
              severity: warning
              team: search-platform
              name: elastic1002-production-search-eqiad
              gc: old
              exported_cluster: production-search-testing
            exp_annotations:
              summary: "OpenSearch instance elastic1002-production-search-eqiad is running the old gc excessively"
              description: "OpenSearch is out of memory and will have degraded latency"
              runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
              dashboard: https://grafana.wikimedia.org/d/000000462/elasticsearch-memory

  - interval: 1m
    input_series:
     - series: elasticsearch_indices_age_days{index="commonswiki_file", exported_cluster="alertmanager-test"}
       values: 121
    alert_rule_test:
     - alertname: CirrusSearchIndexTooOld
       eval_time: 1m
       exp_alerts:
        - exp_labels:
            severity: task
            team: search-platform
            index: commonswiki_file
            exported_cluster: alertmanager-test
          exp_annotations:
            summary: "commonswiki_file index in alertmanager-test is ready for reindexing"
            description: "The reindexing process should be run to ensure multi-lingual analysis chain updates are applied"
            runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
            dashboard: TODO

  - interval: 1m
    input_series:
      - series: kafka_burrow_partition_lag{exported_cluster="main-eqiad",group="cpjobqueue-low_traffic_jobs", topic="eqiad.mediawiki.job.cirrusSearchOtherIndex",partition="0"}
        values: '210000+0x10'
      - series: kafka_burrow_partition_lag{exported_cluster="main-eqiad",group="cpjobqueue-cirrusSearchLinksUpdate", topic="eqiad.mediawiki.job.cirrusSearchLinksUpdate",partition="0"}
        values: 21000
      - series: kafka_burrow_partition_lag{exported_cluster="main-eqiad",group="cpjobqueue-cirrusSearchElasticaWrite_partitioner", topic="eqiad.mediawiki.job.cirrusSearchElasticaWrite",partition="0"}
        values: 220000
    external_labels:
      site: eqiad
    alert_rule_test:
      - alertname: CirrusSearchJobQueueBacklogTooBig
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: warning
              team: search-platform
              group: cpjobqueue-low_traffic_jobs
              partition: 0
              topic: eqiad.mediawiki.job.cirrusSearchOtherIndex
              exported_cluster: main-eqiad
              site: eqiad
            exp_annotations:
              summary: "CirrusSearch job topic eqiad.mediawiki.job.cirrusSearchOtherIndex is heavily backlogged with 210k messages"
              description: "CirrusSearch job backlog is too big"
              runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
              dashboard: "https://grafana.wikimedia.org/d/CbmStnlGk/jobqueue-job?orgId=1&var-dc=eqiad%20prometheus/k8s&var-job=cirrusSearchOtherIndex"

  - interval: 1m
    input_series:
      - series: kafka_server_BrokerTopicMetrics_MessagesIn_total{topic="eqiad.cirrussearch.update_pipeline.update.v1"}
        values: '0x11'
    external_labels:
      site: eqiad
      prometheus: ops
    alert_rule_test:
      - alertname: CirrusSearchUpdaterKafkaMessagesInTooLow
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: critical
              team: search-platform
            exp_annotations:
                  summary: 'The summed message update rate of `(eqiad|codfw).cirrussearch.update_pipeline.update.v1` is too low'
                  description: "Unexpectedly low Kafka topic message-in rate for the last 5 minutes"
                  runbook: 'https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards'
                  dashboard: 'https://grafana.wikimedia.org/d/000000234/kafka-by-topic?orgId=1&var-dc=eqiad%2520prometheus%252Fops&var-kafka_cluster=main-eqiad&var-kafka_broker=All&from=now-1h&to=now&refresh=5m&var-topic=codfw.cirrussearch.update_pipeline.update.v1&var-topic=eqiad.cirrussearch.update_pipeline.update.v1&viewPanel=6'


  - interval: 1m
    input_series:
      - series: elasticsearch_indices_indexing_index_total{exported_cluster="production-search-eqiad", index="", name="elastic1337-production-search-eqiad"}
        values: 0+0x30
    alert_rule_test:
      - alertname: CirrusSearchNodeIndexingNotIncreasing
        eval_time: 30m
        exp_alerts:
          - exp_labels:
              severity: warning
              team: search-platform
              name: elastic1337-production-search-eqiad
              exported_cluster: production-search-eqiad
            exp_annotations:
              summary: "OpenSearch instance elastic1337-production-search-eqiad is not indexing"
              description: "An OpenSearch instance is not performing index work; find out why"
              runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
              dashboard: 'https://grafana.wikimedia.org/d/JLK3I_siz/elasticsearch-indexing?orgId=1&from=now-3d&to=now&viewPanel=57'
  - interval: 1m
    input_series:
      - series: elasticsearch_indices_age_days{exported_cluster="production-search-psi-codfw", index="*_titlesuggest"}
        values: 5+0x10
    alert_rule_test:
      - alertname: CirrusSearchTitleSuggestIndexTooOld
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              severity: warning
              team: search-platform
              index: '*_titlesuggest'
              exported_cluster: production-search-psi-codfw
            exp_annotations:
              summary: "Some search indices that power autocomplete have not been updated recently"
              description: "The daily build process for autocomplete indices is probably having issues and should be investigated."
              runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
              dashboard: 'TODO'

  - interval: 1m
    input_series:
      - series: 'elasticsearch_thread_pool_rejected_count{type="search", job="elasticsearch", exported_cluster="production-search-eqiad", name="elastic1066-production-search-eqiad", instance="elastic1066:9108"}'
        values: 0+100x10000
    external_labels:
      site: eqiad
      prometheus: ops
    alert_rule_test:
      - alertname: CirrusSearchThreadPoolRejectionsTooHigh
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              team: search-platform
              exported_cluster: production-search-eqiad
              instance: elastic1066:9108
              job: elasticsearch
              name: elastic1066-production-search-eqiad
              severity: critical
              type: search
            exp_annotations:
              summary: "elastic1066-production-search-eqiad is rejecting excessive amounts of queries due to a full thread pool"
              description: "Check hot shards and consider banning the node to force shard reallocation"
              runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
              dashboard: 'https://grafana.wikimedia.org/goto/aoZBw8pNR?orgId=1'

  - interval: 1m
    input_series:
      - series: 'up{instance="elastic1066:9108", cluster="elasticsearch", job="elasticsearch"}'
        values: "0x50 0"
      - series: 'role_owner{instance="elastic1066:9100", cluster="elasticsearch", team="search-platform"}'
        values: "1x50 1"
      - series: 'elasticsearch_clusterinfo_version_info{cluster="elasticsearch", exported_cluster="production-search-eqiad", instance="elastic1066:9108"}'
        values: "1x50 1"
    external_labels:
      site: eqiad
    alert_rule_test:
      - alertname: CirrusSearchAPIsUnreachable
        eval_time: 5m
        exp_alerts:
          - exp_labels:
              cluster: elasticsearch
              exported_cluster: production-search-eqiad
              severity: warning
              nodename: elastic1066
              instance: elastic1066:9108
              team: search-platform
            exp_annotations:
              summary: OpenSearch API endpoint not reachable on instance elastic1066:9108
              description: OpenSearch API endpoint not reachable on instance elastic1066:9108
              dashboard:
                "https://grafana.wikimedia.org/d/e7d7fa18-7bc3-4548-bb07-ef261a9d3b8b/opensearch-cluster-health\
                ?var-cluster=production-search-eqiad"
              runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards

  - interval: 1m
    input_series:
      - series: 'elasticsearch_cluster_health_status{color="yellow", exported_cluster="production-search-eqiad", instance="elastic1066:9108", cluster="elasticsearch"}'
        values: "1x720 1"
      - series: 'role_owner{instance="elastic1066:9100", cluster="elasticsearch", team="search-platform"}'
        values: "1x720 1"
    external_labels:
      site: eqiad
    alert_rule_test:
      - alertname: CirrusSearchClusterHealth
        eval_time: 12h
        exp_alerts:
          - exp_labels:
              cluster: elasticsearch
              exported_cluster: production-search-eqiad
              color: yellow
              severity: warning
              team: search-platform
            exp_annotations:
              summary: OpenSearch cluster health reported as yellow
              description: OpenSearch cluster health reported as yellow
              dashboard:
                "https://grafana.wikimedia.org/d/e7d7fa18-7bc3-4548-bb07-ef261a9d3b8b/opensearch-cluster-health\
                ?var-cluster=production-search-eqiad"
              runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards

  - interval: 1m
    input_series:
      - series: 'elasticsearch_cluster_health_status{color="red", exported_cluster="production-search-eqiad", instance="elastic1066:9108", cluster="elasticsearch"}'
        values: "1x50 0"
      - series: 'role_owner{instance="elastic1066:9100", cluster="elasticsearch", team="search-platform"}'
        values: "1x50 1"
    external_labels:
      site: eqiad
    alert_rule_test:
      - alertname: CirrusSearchClusterHealth
        eval_time: 5m
        exp_alerts:
          - exp_labels:
              cluster: elasticsearch
              exported_cluster: production-search-eqiad
              color: red
              severity: critical
              team: search-platform
            exp_annotations:
              summary: OpenSearch cluster health reported as red
              description: OpenSearch cluster health reported as red
              dashboard:
                "https://grafana.wikimedia.org/d/e7d7fa18-7bc3-4548-bb07-ef261a9d3b8b/opensearch-cluster-health\
                ?var-cluster=production-search-eqiad"
              runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards

  - interval: 1m
    input_series:
      - series: 'elasticsearch_cluster_health_unassigned_shards{exported_cluster="production-search-eqiad", instance="elastic1066:9108", cluster="elasticsearch"}'
        values: "50x720 0"
      - series: 'elasticsearch_cluster_health_initializing_shards{exported_cluster="production-search-eqiad", instance="elastic1066:9108", cluster="elasticsearch"}'
        values: "50x720 0"
      - series: 'elasticsearch_cluster_health_active_shards{exported_cluster="production-search-eqiad", instance="elastic1066:9108", cluster="elasticsearch"}'
        values: "50x720 0"
      - series: 'elasticsearch_cluster_health_relocating_shards{exported_cluster="production-search-eqiad", instance="elastic1066:9108", cluster="elasticsearch"}'
        values: "50x720 0"
      - series: 'elasticsearch_cluster_health_active_primary_shards{exported_cluster="production-search-eqiad", instance="elastic1066:9108", cluster="elasticsearch"}'
        values: "50x720 0"
      - series: 'elasticsearch_cluster_health_delayed_unassigned_shards{exported_cluster="production-search-eqiad", instance="elastic1066:9108", cluster="elasticsearch"}'
        values: "50x720 0"
      - series: 'role_owner{instance="elastic1066:9100", cluster="elasticsearch", team="search-platform"}'
        values: "1x720 1"
    external_labels:
      site: eqiad
    alert_rule_test:
      - alertname: CirrusSearchUnassignedOrInitializingShardsRatio
        eval_time: 12h
        exp_alerts:
          - exp_labels:
              cluster: elasticsearch
              exported_cluster: production-search-eqiad
              severity: critical
              team: search-platform
            exp_annotations:
              summary: Unassigned+Initializing shards exceed the allowed ratio
              description: Unassigned+Initializing shards exceed the allowed ratio
              dashboard:
                "https://grafana.wikimedia.org/d/e7d7fa18-7bc3-4548-bb07-ef261a9d3b8b/opensearch-cluster-health\
                ?var-cluster=production-search-eqiad"
              runbook: https://wikitech.wikimedia.org/wiki/Search/OpenSearch/Administration#Alerts/Dashboards
