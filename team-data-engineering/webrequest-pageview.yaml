# deploy-tag: k8s-dse
# deploy-site: eqiad
# Alerts are enabled only on dse-k8s.
groups:
  - name: webrequest-pageview
    rules:
      - alert: WebrequestPageviewJobManagerNotRunning
        expr: |
          absent(flink_jobmanager_job_uptime{kubernetes_namespace="webrequest-pageview", release="production", job_name="page_view"})
        for: 5m
        labels:
          team: data-engineering
          severity: critical
        annotations:
          summary: "{{ $labels.job_name }} in {{$externalLabels.site}} is not running"
          description: "The {{ $labels.job_name }} job is not running"
          dashboard: 'https://grafana.wikimedia.org/d/K9x0c4aVk/flink-app?orgId=1&var-datasource={{ $externalLabels.site }}%20prometheus/k8s-dse&var-namespace={{ $labels.kubernetes_namespace }}&var-helm_release={{ $labels.release }}&var-operator_name=All&var-flink_job_name={{ $labels.job_name }}'
          dashboard_overview: 'https://grafana.wikimedia.org/d/relative-trending-pipeline/relative-trending-pipeline'
          runbook: https://wikitech.wikimedia.org/wiki/MediaWiki_Event_Enrichment/Webrequest_Pageview

      - alert: WebrequestPageviewTaskManagerNotRunning
        # Task managers (workers) are not running. There is a valid deployment, but the application is not operating properly.
        expr: |
          flink_jobmanager_numRegisteredTaskManagers{kubernetes_namespace="webrequest-pageview", release="production"} == 0
        for: 5m
        labels:
          team: data-engineering
          severity: critical
        annotations:
          summary: "The {{ $labels.kubernetes_namespace }} Flink cluster in {{$externalLabels.site}} has no registered TaskManagers"
          description: "The {{ $labels.kubernetes_namespace }} Flink cluster in {{$externalLabels.site}} has no registered TaskManagers"
          dashboard: 'https://grafana.wikimedia.org/d/K9x0c4aVk/flink-app?orgId=1&var-datasource={{ $externalLabels.site }}%20prometheus/k8s-dse&var-namespace={{ $labels.kubernetes_namespace }}&var-helm_release={{ $labels.release }}&var-operator_name=All&var-flink_job_name=All'
          dashboard_overview: 'https://grafana.wikimedia.org/d/relative-trending-pipeline/relative-trending-pipeline'
          runbook: https://wikitech.wikimedia.org/wiki/MediaWiki_Event_Enrichment/Webrequest_Pageview

      - alert: WebrequestPageviewHighDroppedRecordsRate
        # The percentage of records dropped by filter-missing-key, because wiki_id or page_id is
        # null, has exceeded 15% for 30 minutes.
        # Denominator is clamped to 1 to avoid division by zero when no messages are flowing.
        expr: |
          100 *
            (
              sum(increase(flink_taskmanager_job_task_operator_numRecordsOut{kubernetes_namespace="webrequest-pageview", release="production", operator_name="enrich"}[10m]))
              -
              sum(increase(flink_taskmanager_job_task_operator_numRecordsOut{kubernetes_namespace="webrequest-pageview", release="production", operator_name="filter_missing_key"}[10m]))
            )
          /
          clamp_min(
            sum(increase(flink_taskmanager_job_task_operator_numRecordsOut{kubernetes_namespace="webrequest-pageview", release="production", operator_name="enrich"}[10m])),
            1
          )
          > 15
        for: 30m
        labels:
          team: data-engineering
          severity: warning
        annotations:
          summary: "High dropped record rate for webrequest-pageview in {{ $externalLabels.site }}."
          description: "More than 15% of enriched pageviews have been dropped by filter-missing-key for 30 minutes because wiki_id or page_id is null. These pageviews are lost. Check the SiteMatrix loader and the page_id extraction against the upstream webrequest data."
          dashboard: 'https://grafana.wikimedia.org/d/relative-trending-pipeline/relative-trending-pipeline'
          runbook: https://wikitech.wikimedia.org/wiki/MediaWiki_Event_Enrichment/Webrequest_Pageview

      # WebrequestPageviewNoOutputMessages is in relative-trending-kafka.yaml.

      - alert: WebrequestPageviewHighKafkaConsumerLag
        # The application is experiencing latency in consuming from Kafka brokers.
        expr: |
          flink_taskmanager_job_task_operator_KafkaSourceReader_KafkaConsumer_records_lag_max{kubernetes_namespace="webrequest-pageview", release="production", job_name="page_view"} > 100000
        for: 10m
        labels:
          team: data-engineering
          severity: warning
        annotations:
          summary: "High Kafka consumer lag for {{$labels.job_name}} in {{ $externalLabels.site }}"
          description: "Maximum lag of the consumed Kafka topic partition exceeds threshold"
          dashboard: 'https://grafana.wikimedia.org/d/K9x0c4aVk/flink-app?orgId=1&var-datasource={{ $externalLabels.site }}%20prometheus/k8s-dse&var-namespace={{ $labels.kubernetes_namespace }}&var-helm_release={{ $labels.release }}&var-operator_name=All&var-flink_job_name={{ $labels.job_name }}'
          dashboard_overview: 'https://grafana.wikimedia.org/d/relative-trending-pipeline/relative-trending-pipeline'
          runbook: https://wikitech.wikimedia.org/wiki/MediaWiki_Event_Enrichment/Webrequest_Pageview

      - alert: WebrequestPageviewLowPageviewRatio
        # Around 8% of webrequest_frontend_text records are pageviews (observed p5 7.2%, p50 8.1%).
        # A sustained drop below 5% means the pageview filter or the upstream data changed.
        expr: |
          (
            100 *
              sum(flink_taskmanager_job_task_operator_numRecordsOutPerSecond{kubernetes_namespace="webrequest-pageview", release="production", operator_name="filter_pageviews"})
            /
            clamp_min(
              sum(flink_taskmanager_job_task_operator_numRecordsOutPerSecond{kubernetes_namespace="webrequest-pageview", release="production", operator_name="Source:_webrequest_frontend_text_v1_source"}),
              1
            )
            < 5
          )
          and
          sum(flink_taskmanager_job_task_operator_numRecordsOutPerSecond{kubernetes_namespace="webrequest-pageview", release="production", operator_name="Source:_webrequest_frontend_text_v1_source"}) > 1000
        for: 30m
        labels:
          team: data-engineering
          severity: warning
        annotations:
          summary: "Low pageview ratio for webrequest-pageview in {{ $externalLabels.site }}"
          description: "Less than 5% of incoming webrequest_frontend_text records are being classified as pageviews (normally around 8%). The pageview filter or the upstream webrequest data may have changed."
          dashboard: 'https://grafana.wikimedia.org/d/relative-trending-pipeline/relative-trending-pipeline'
          runbook: https://wikitech.wikimedia.org/wiki/MediaWiki_Event_Enrichment/Webrequest_Pageview

