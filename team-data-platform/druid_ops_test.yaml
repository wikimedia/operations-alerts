rule_files:
  - druid_ops.yaml
evaluation_interval: 1m
tests:

## Druid node PSI memory stall
    - interval: 1m
      input_series:
        - series: 'node_pressure_memory_stalled_seconds_total{cluster="druid_analytics", instance="an-druid1001:9100", job="node", site="eqiad"}'
          values: '0+7x30'
      external_labels:
        site: eqiad
      alert_rule_test:
      - alertname: DruidNodeMemoryStall
        eval_time: 15m
        exp_alerts:
        - exp_labels:
            cluster: druid_analytics
            instance: 'an-druid1001:9100'
            job: node
            severity: critical
            site: eqiad
            team: 'data-platform'
          exp_annotations:
            description: 'Memory stalled on an-druid1001:9100'
            summary: 'an-druid1001:9100 is stalled on memory, current value 11.67%'
            dashboard: https://grafana.wikimedia.org/d/000000342/node-exporter-server-metrics?timezone=utc&var-datasource=000000006&var-node=an-druid1001:9100&var-disk_device=%24__all&var-net_dev=%24__all&viewPanel=panel-322
            runbook: 'TODO'

## Druid node PSI IO stall
    - interval: 1m
      input_series:
        - series: 'node_pressure_io_stalled_seconds_total{cluster="druid_analytics", instance="an-druid1001:9100", job="node", site="eqiad"}'
          values: '0+7x30'
      external_labels:
        site: eqiad
      alert_rule_test:
      - alertname: DruidNodeIOStall
        eval_time: 15m
        exp_alerts:
        - exp_labels:
            cluster: druid_analytics
            instance: 'an-druid1001:9100'
            job: node
            severity: critical
            site: eqiad
            team: 'data-platform'
          exp_annotations:
            description: 'IO stalled on an-druid1001:9100'
            summary: 'an-druid1001:9100 is stalled on IO, current value 11.67%'
            dashboard: https://grafana.wikimedia.org/d/000000342/node-exporter-server-metrics?timezone=utc&var-datasource=000000006&var-node=an-druid1001:9100&var-disk_device=%24__all&var-net_dev=%24__all&viewPanel=panel-322
            runbook: 'TODO'
